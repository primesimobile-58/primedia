name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Build Next.js
        run: npm run build
      - name: Start Next.js
        run: |
          npm run start &
          echo $! > .next_pid
      - name: Wait for server
        run: npx wait-on http://localhost:3000
      - name: Health check
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3000/api/health | grep -E "200"
      - name: Run Playwright tests
        run: npx playwright test
      - name: Stop server
        if: always()
        run: |
          kill $(cat .next_pid) || true
